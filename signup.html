<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — NestFind</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon">🏡</span>
      Nest<span>Find</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="buy.html" class="nav-link">Buy</a>
      <a href="rent.html" class="nav-link">Rent</a>
      <a href="sell.html" class="nav-link">Sell</a>
      <a href="about.html" class="nav-link">About</a>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="btn-outline">Login</a>
      <a href="signup.html" class="btn-primary" style="pointer-events:none; opacity:0.5;">Sign Up</a>
    </div>
  </div>
</nav>

<!-- AUTH PAGE -->
<div class="auth-page" style="padding: 32px 16px;">
  <div class="auth-box" style="max-width: 480px;">

    <div class="auth-head">
      <div class="auth-logo">🏡 Nest<span>Find</span></div>
      <p>Join millions finding their dream property across India</p>
    </div>

    <h2>Create Free Account</h2>
    <p class="auth-sub">Takes less than 2 minutes — no credit card needed</p>

    <form action="login.html">

      <div class="frow">
        <div class="fg">
          <label>First Name *</label>
          <div class="icw">
            <span class="ic">👤</span>
            <input class="fc" type="text" placeholder="Rahul" required/>
          </div>
        </div>
        <div class="fg">
          <label>Last Name *</label>
          <input class="fc" type="text" placeholder="Sharma" required/>
        </div>
      </div>

      <div class="fg">
        <label>Email Address *</label>
        <div class="icw">
          <span class="ic">📧</span>
          <input class="fc" type="email" placeholder="rahul@example.com" required/>
        </div>
      </div>

      <div class="fg">
        <label>Mobile Number *</label>
        <div style="display:flex; gap:8px;">
          <select class="fc" style="width:90px; flex-shrink:0;">
            <option>🇮🇳 +91</option>
            <option>🇺🇸 +1</option>
            <option>🇬🇧 +44</option>
            <option>🇦🇺 +61</option>
            <option>🇦🇪 +971</option>
          </select>
          <div class="icw" style="flex:1;">
            <span class="ic">📱</span>
            <input class="fc" type="tel" placeholder="98765 43210" required/>
          </div>
        </div>
      </div>

      <div class="frow">
        <div class="fg">
          <label>Password *</label>
          <div class="icw">
            <span class="ic">🔒</span>
            <input class="fc" type="password" placeholder="Min 8 characters" required/>
          </div>
        </div>
        <div class="fg">
          <label>Confirm Password *</label>
          <div class="icw">
            <span class="ic">🔒</span>
            <input class="fc" type="password" placeholder="Repeat password" required/>
          </div>
        </div>
      </div>

      <div class="fg" style="margin-top:4px;">
        <label class="fcheck">
          <input type="checkbox" required/>
          I agree to the <a href="#" style="color:var(--primary); font-weight:600;">Terms of Service</a> &amp; <a href="#" style="color:var(--primary); font-weight:600;">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn-submit" style="margin-top:8px;">Create My Free Account</button>
    </form>

    <div class="auth-sw">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>
  </div>
</div>

</body>
</html>
