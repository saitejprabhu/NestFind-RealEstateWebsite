<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — NestFind</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon">🏡</span>
      Nest<span>Find</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="buy.html" class="nav-link">Buy</a>
      <a href="rent.html" class="nav-link">Rent</a>
      <a href="sell.html" class="nav-link">Sell</a>
      <a href="about.html" class="nav-link">About</a>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="btn-outline" style="pointer-events:none; opacity:0.5;">Login</a>
      <a href="signup.html" class="btn-primary">Sign Up</a>
    </div>
  </div>
</nav>

<!-- AUTH PAGE -->
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-head">
      <div class="auth-logo">🏡 Nest<span>Find</span></div>
      <p>Your trusted partner for real estate in India</p>
    </div>

    <h2>Welcome Back!</h2>
    <p class="auth-sub">Sign in to access your saved listings &amp; inquiries</p>

    <form action="index.html">

      <div class="fg">
        <label>Email / Mobile Number</label>
        <div class="icw">
          <span class="ic">📧</span>
          <input class="fc" type="text" placeholder="Enter email or mobile number" required/>
        </div>
      </div>

      <div class="fg">
        <label>Password</label>
        <div class="icw">
          <span class="ic">🔒</span>
          <input class="fc" type="password" placeholder="Enter your password" required/>
        </div>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <div class="fg">
        <label class="fcheck">
          <input type="checkbox" checked/>
          Keep me signed in for 30 days
        </label>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-sw">
      New to NestFind? <a href="signup.html">Create a free account</a>
    </div>
  </div>
</div>

</body>
</html>
