<!-- AUTH PAGE -->
<div class="auth-page">
  <div class="auth-box">
    <h2>Send an Inquiry</h2>
    <p class="auth-sub">We'll get back to you within 24 hours</p>

    <form data-form="inquiry">
      <input type="hidden" data-field="listing_id" value=""/> <!-- optional -->

      <div class="fg">
        <label>Full Name</label>
        <div class="icw">
          <span class="ic">👤</span>
          <input class="fc" type="text" data-field="name" placeholder="Enter your full name" required/>
        </div>
      </div>

      <div class="fg">
        <label>Email Address</label>
        <div class="icw">
          <span class="ic">📧</span>
          <input class="fc" type="email" data-field="email" placeholder="Enter your email" required/>
        </div>
      </div>

      <div class="fg">
        <label>Mobile Number</label>
        <div class="icw">
          <span class="ic">📱</span>
          <input class="fc" type="tel" data-field="mobile" placeholder="10-digit mobile number" required/>
        </div>
      </div>

      <div class="fg">
        <label>Message</label>
        <div class="icw">
          <span class="ic">💬</span>
          <textarea class="fc" data-field="message" placeholder="Describe your requirement (min 10 chars)" rows="4" required></textarea>
        </div>
      </div>

      <button type="submit" class="btn-submit">Send Inquiry</button>
    </form>
  </div>
</div>
