<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — NestFind</title>
  <link rel="stylesheet" href="../style.css"/>
  <style>
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
    .admin-login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .admin-login-box {
      background: var(--white);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .admin-login-head {
      text-align: center;
      margin-bottom: 28px;
    }
    .admin-shield {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
    }
    .admin-login-head h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .admin-login-head p {
      color: var(--text-muted);
      font-size: 13px;
    }
    .admin-badge-strip {
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .back-link a { color: var(--primary); font-weight: 600; }
    .default-creds {
      background: var(--primary-light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 16px;
      text-align: center;
    }
    .default-creds strong { color: var(--primary); }
  </style>
</head>
<body>

<div class="admin-login-page">
  <div class="admin-login-box">

    <div class="admin-login-head">
      <span class="admin-shield">🛡️</span>
      <h2>Admin Portal</h2>
      <p>NestFind Dashboard Access</p>
    </div>

    <div class="admin-badge-strip">RESTRICTED — AUTHORISED PERSONNEL ONLY</div>

    <!-- Alert messages -->
    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <form id="adminLoginForm">

      <div class="fg">
        <label>Username or Email</label>
        <div class="icw">
          <span class="ic">👤</span>
          <input class="fc" type="text" id="adminUsername" placeholder="Enter admin username" required/>
        </div>
      </div>

      <div class="fg">
        <label>Password</label>
        <div class="icw">
          <span class="ic">🔒</span>
          <input class="fc" type="password" id="adminPassword" placeholder="Enter admin password" required/>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">🛡️ Access Dashboard</button>
    </form>

    <div class="default-creds">
      Default: <strong>admin</strong> / <strong>admin123</strong>
    </div>

    <div class="back-link">
      ← <a href="../login.html">Back to User Login</a>
    </div>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
/**
 * Admin Login Page Script
 * Sends credentials to api/admin_auth.php and redirects on success.
 */
$(document).ready(function () {

  // Check if already logged in → redirect to dashboard
  $.get('../api/admin_auth.php?action=check', function (res) {
    if (res.loggedIn) {
      window.location.href = 'dashboard.html';
    }
  });

  // Handle login form submit
  $('#adminLoginForm').on('submit', function (e) {
    e.preventDefault();
    const username = $('#adminUsername').val().trim();
    const password = $('#adminPassword').val().trim();

    if (!username || !password) {
      showAlert('error', 'Please enter both username and password.');
      return;
    }

    const $btn = $('#loginBtn');
    $btn.prop('disabled', true).text('Signing in…');

    $.ajax({
      url: '../api/admin_auth.php?action=login',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ username, password }),
      success: function (res) {
        if (res.success) {
          showAlert('success', 'Login successful! Redirecting…');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
        } else {
          showAlert('error', res.message || 'Login failed.');
          $btn.prop('disabled', false).text('🛡️ Access Dashboard');
        }
      },
      error: function () {
        showAlert('error', 'Server error. Please try again.');
        $btn.prop('disabled', false).text('🛡️ Access Dashboard');
      }
    });
  });

  // Helper: show alert message
  function showAlert(type, message) {
    $('#alertError, #alertSuccess').hide();
    if (type === 'error') {
      $('#alertError').text(message).fadeIn();
    } else {
      $('#alertSuccess').text(message).fadeIn();
    }
  }
});
</script>
</body>
</html>
